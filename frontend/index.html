<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/logo_aubun.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="AUBUNWORLD — quiet luxury, crafted with intention. Timeless pieces designed to become part of your story.">
    <title>AUBUNWORLD</title>

    <!-- Fonts: preconnect + link so they render before the bundle and power the splash -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">

    <!-- Critical splash-screen styles — must render before the JS bundle loads -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
        color: #faf9f6;
        background:
          radial-gradient(circle at 25% 18%, #2c2c2c 0%, transparent 55%),
          radial-gradient(circle at 80% 85%, #1f1f1f 0%, transparent 52%),
          linear-gradient(160deg, #0a0a0a 0%, #151515 48%, #080808 100%);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
      }
      #app-loader.app-loader--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-loader__orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(80px);
        background: radial-gradient(circle, rgba(201, 169, 98, 0.18), transparent 65%);
        animation: app-loader-float 7s ease-in-out infinite;
        will-change: transform;
      }
      .app-loader__orb--a { width: 28rem; height: 28rem; left: -15%; top: 8%; }
      .app-loader__orb--b { width: 24rem; height: 24rem; right: -15%; bottom: 8%; animation-duration: 9s; }
      .app-loader__content {
        position: relative;
        z-index: 1;
        padding: 0 1.5rem;
        max-width: 92vw;
      }
      .app-loader__eyebrow {
        margin: 0 0 1.5rem;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #c9a962;
        opacity: 0;
        animation: app-loader-fade-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }
      .app-loader__wordmark {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 300;
        font-size: clamp(1.75rem, 8vw, 3.5rem);
        line-height: 1;
        letter-spacing: 0.4em;
        text-indent: 0.3em; /* keep the tracking-centered wordmark optically centered */
        color: #faf9f6;
        opacity: 0;
        transform: translateY(14px);
        animation: app-loader-wordmark 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      }
      .app-loader__line {
        position: relative;
        width: 12rem;
        max-width: 60vw;
        height: 1px;
        margin: 2rem auto 0;
        background: rgba(250, 249, 246, 0.15);
        overflow: hidden;
      }
      .app-loader__line span {
        position: absolute;
        inset: 0;
        transform: scaleX(0);
        transform-origin: left;
        background: linear-gradient(90deg, transparent, #c9a962, #e0c88a, #c9a962, transparent);
        animation: app-loader-line 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0.45s forwards;
      }
      .app-loader__tagline {
        margin: 1.5rem 0 0;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(250, 249, 246, 0.4);
        opacity: 0;
        animation: app-loader-fade-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      }
      @keyframes app-loader-fade-up {
        to { opacity: 1; transform: none; }
      }
      @keyframes app-loader-wordmark {
        to { opacity: 1; transform: none; letter-spacing: 0.3em; }
      }
      @keyframes app-loader-line {
        to { transform: scaleX(1); }
      }
      @keyframes app-loader-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-18px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader,
        .app-loader__orb,
        .app-loader__eyebrow,
        .app-loader__wordmark,
        .app-loader__line span,
        .app-loader__tagline {
          animation: none !important;
        }
        .app-loader__eyebrow,
        .app-loader__wordmark,
        .app-loader__tagline {
          opacity: 1;
          transform: none;
        }
        .app-loader__line span { transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Pre-render splash: visible instantly, removed once the app has mounted -->
    <div id="app-loader" aria-hidden="true">
      <div class="app-loader__orb app-loader__orb--a"></div>
      <div class="app-loader__orb app-loader__orb--b"></div>
      <div class="app-loader__content">
        <p class="app-loader__eyebrow">Autumn / Winter 2025</p>
        <div class="app-loader__wordmark">AUBUNWORLD</div>
        <div class="app-loader__line"><span></span></div>
        <p class="app-loader__tagline">Crafted with intention</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <noscript>
      <style>#app-loader { display: none !important; }</style>
    </noscript>
  </body>
</html>
